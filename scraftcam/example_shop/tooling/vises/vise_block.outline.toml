kind = "outline"
version = 6
revolve = false

[letters.L]
name = "Length"
default = "6 in"
help = "The block's length, along its slot."

[letters.W]
name = "Width"
default = "4 in"
help = "The block's width, across its slot."

[letters.H]
name = "Height"
default = "1-1/2 in"
help = "The block's height."

[letters.E]
name = "End"
default = "1-1/4 in"
help = "From each end of the block to its slot."

[letters.SW]
name = "Slot width"
default = "1-1/4 in"
help = "The slot's width."

[letters.SD]
name = "Slot depth"
default = "1/2 in"
help = "How deep the slot is cut."

[letters.CB]
name = "Counterbore"
default = "13/16 in"
help = "The counterbores' diameter (a 1/2 in socket head cap screw's)."

[letters.CBD]
name = "Counterbore depth"
default = "1/2 in"
help = "How deep the counterbores are cut."

[letters.CH]
name = "Clearance hole"
default = "17/32 in"
help = "The screws' clearance holes, through."

[letters.SY]
name = "Slot side"
formula = "(W - SW) / 2"
help = "From the block's side to its slot."

[letters.SL]
name = "Slot length"
formula = "L - 2 * E"
help = "The slot's length."

[letters.HX]
name = "Hole in"
formula = "E / 2"
help = "From the block's end to a hole's center."

[letters.HY]
name = "Hole side"
formula = "W / 2"
help = "From the block's side to the holes' centers."

[letters.HS]
name = "Hole spacing"
formula = "L - E"
help = "Between the holes' centers."

