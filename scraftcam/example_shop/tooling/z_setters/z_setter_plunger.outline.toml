kind = "outline"
version = 6
revolve = true

[letters.D]
name = "Diameter"
default = "1 in"
help = "The plunger's diameter."

[letters.R]
name = "Rise"
default = "1/4 in"
help = "How far it stands above the block."

[letters.C]
name = "Chamfer"
default = "0.1 in"
help = "The 45 degree chamfer at its top edge."

[letters.RC]
name = "Rise to chamfer"
formula = "R - C"
help = "From its bottom to the chamfer."

[letters.DC]
name = "Chamfer radius"
formula = "D / 2 - C"
help = "From the axis to the chamfer's top."

